apiVersion: v1
kind: Pod
metadata:
  name: {{ include "zerowatch.fullname" . }}-test
  labels:
    {{- include "zerowatch.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      args: ["-fsS", "--retry", "10", "--retry-connrefused", "--retry-delay", "3",
             "http://{{ include "zerowatch.fullname" . }}:{{ .Values.ports.http }}/readyz"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
