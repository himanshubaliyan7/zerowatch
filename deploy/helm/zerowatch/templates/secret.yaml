{{- if not .Values.secrets.existingSecret }}
{{- $name := include "zerowatch.fullname" . }}
{{- $key := .Values.secrets.keys.clusterSecret }}
{{- /* Keep a generated cluster secret stable across upgrades. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $cluster := index .Values.secrets.values $key | default "" }}
{{- if and (not $cluster) $old $old.data }}
{{- $cluster = index $old.data $key | default "" | b64dec }}
{{- end }}
{{- if not $cluster }}
{{- $cluster = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "zerowatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $val := .Values.secrets.values }}
  {{- if ne $k $key }}
  {{ $k }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
  # Internal RPC auth between nodes. Generated when not given: member-IP auth
  # can't work for hostNetwork agents (the pod sees the node's pod-CIDR
  # gateway as the source, not the gossiped node IP).
  {{ $key }}: {{ $cluster | quote }}
{{- end }}
