# ZeroWatch backing services for the ClickHouse storage engine and the Kafka
# commit log. Used by the integration tests (see README.md in this folder) and
# usable as a dev stack: zerowatch --storage=clickhouse --commitlog=kafka.
name: zw-integration

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    environment:
      CLICKHOUSE_USER: zw
      CLICKHOUSE_PASSWORD: zw
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible bucket for the cold tier (internal/tier). Behind the "tier"
  # profile so `docker compose up` starts the same services as before:
  #   docker compose --profile tier up -d minio
  # The minio/minio images are no longer pullable from Docker Hub or quay.io;
  # this is Chainguard's build of the same MinIO server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["tier"]
    command: ["server", "/tmp/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: zwtier
      MINIO_ROOT_PASSWORD: zwtiersecret
    ports:
      - "9000:9000"
      - "9001:9001"
